name: Release

# Build a universal macOS .dmg — signed with the Developer ID certificate and notarized by Apple — and
# attach it to a GitHub Release whenever a version tag (e.g. v0.1.0) is pushed.
#
# Besides the versioned asset, every release also carries a copy named `AI-Account-Switcher.dmg`, so
#   https://github.com/hoangpm96/ai-switcher/releases/latest/download/AI-Account-Switcher.dmg
# always serves the newest build (the download button on the website links there). The release is
# created as a draft and only published once the stapled .dmg is uploaded, so that link never points
# at a release that is still missing its file.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE           base64 of the exported "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  the password chosen when exporting that .p12
#   APPLE_ID                    Apple ID email of the developer account
#   APPLE_PASSWORD              an app-specific password for that Apple ID (for notarization)
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Fail early and loudly: an unsigned build would be blocked by Gatekeeper on every Mac.
      - name: Check signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -m1 'Developer ID Application' | awk -F'"' '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in APPLE_CERTIFICATE"
            exit 1
          fi
          TEAM_ID="$(echo "$IDENTITY" | sed -E 's/.*\(([A-Z0-9]{10})\)$/\1/')"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust (Intel + Apple Silicon targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Signs the app with APPLE_SIGNING_IDENTITY (hardened runtime + Entitlements.plist), notarizes
      # and staples the .app with APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID, then builds and signs the .dmg.
      - name: Build, sign and notarize
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AI Account Switcher ${{ github.ref_name }}"
          releaseBody: |
            Universal macOS build (Apple Silicon + Intel), signed with a Developer ID and notarized
            by Apple. Download the `.dmg` under **Assets**, open it, and drag **AI Account Switcher**
            to Applications.

            See the [CHANGELOG](https://github.com/hoangpm96/ai-switcher/blob/main/CHANGELOG.md)
            for what changed in this version.
          releaseDraft: true
          prerelease: false
          # Auto-append the list of merged commits/PRs since the last tag.
          generateReleaseNotes: true
          args: --target universal-apple-darwin

      # Tauri notarizes the .app inside the .dmg but not the .dmg itself. Notarize and staple the
      # .dmg too, so the downloaded file carries its own ticket, then replace the uploaded asset with
      # it and add the fixed-name copy.
      - name: Notarize the .dmg and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          DMG="$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)"
          [ -f "$DMG" ] || { echo "::error::No .dmg was built"; exit 1; }

          RESULT="$(xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --output-format json)"
          echo "$RESULT"
          if [ "$(echo "$RESULT" | jq -r .status)" != "Accepted" ]; then
            xcrun notarytool log "$(echo "$RESULT" | jq -r .id)" --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
            echo "::error::Apple did not accept the .dmg for notarization"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"

          ASSET="$(gh release view "$TAG" --json assets -q '.assets[].name' \
            | grep '\.dmg$' | grep -v '^AI-Account-Switcher\.dmg$' | head -1)"
          [ -n "$ASSET" ] || { echo "::error::The release has no .dmg asset to replace"; exit 1; }
          cp "$DMG" "$RUNNER_TEMP/$ASSET"
          cp "$DMG" "$RUNNER_TEMP/AI-Account-Switcher.dmg"
          gh release upload "$TAG" "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/AI-Account-Switcher.dmg" --clobber
          gh release edit "$TAG" --draft=false --latest

      - name: Remove the build keychain
        if: always()
        run: |
          [ -n "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
